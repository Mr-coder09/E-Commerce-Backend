apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: github-actions-role-binding
  namespace: ecommerce

subjects:

  - kind: ServiceAccount
    name: github-actions
    namespace: ecommerce

roleRef:

  kind: Role
  name: github-actions-role
  apiGroup: rbac.authorization.k8s.io
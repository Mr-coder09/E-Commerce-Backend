name: Build Spring Boot Project

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Project
        run: ./mvnw clean package

      - name: SonarCloud Analysis
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=Mr-coder09_E-Commerce-Backend \
            -Dsonar.organization=sangmesh \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t mrcoder09/ecommerce-backend:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mrcoder09/ecommerce-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          cache: 'false'

      - name: Push Docker Image
        run: docker push mrcoder09/ecommerce-backend:latest

      - name: Configure Kubernetes Access
        run: |
          kubectl config set-cluster kind-kind \
            --server="${{ secrets.KUBE_SERVER }}" \
            --certificate-authority-data="${{ secrets.KUBE_CA_CERT }}"

          kubectl config set-credentials github-actions \
            --token="${{ secrets.KUBE_TOKEN }}"

          kubectl config set-context github-actions-context \
            --cluster=kind-kind \
            --user=github-actions \
            --namespace=ecommerce

          kubectl config use-context github-actions-context

      - name: Verify Kubernetes Access
        run: |
          kubectl get namespace ecommerce
          kubectl auth can-i get deployments -n ecommerce

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/ecommerce/

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/ecommerce-deployment -n ecommerce